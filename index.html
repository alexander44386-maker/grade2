  /* ---------------- GENERAL SCREEN (Grade 3 Readiness Word List — reference, not lessons/quiz) ---------------- */
  function GeneralScreen(){
    const subject = currentSubject();
    const [query, setQuery] = useState("");
    const [openCats, setOpenCats] = useState(()=>({[GENERAL_CATEGORIES[0].id]:true}));
    const q = query.trim().toLowerCase();

    const totalWords = GENERAL_CATEGORIES.reduce((n,c)=>n+c.words.length,0);
    const knownCount = Object.keys(generalKnown).filter(k=>generalKnown[k]).length;
    const overallPct = totalWords ? Math.round((knownCount/totalWords)*100) : 0;

    function toggleCat(id){
      Sound.nav();
      setOpenCats(prev=>({...prev, [id]: !prev[id]}));
    }

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={goDashboard}>←</button>
          <div className="icon-badge-sm" style={{background:subject.soft}}><SubjectIcon icon={subject.icon}/></div>
          <div>
            <div className="qnum">{subject.name}</div>
            <h1 style={{margin:0, fontSize:"21px"}}>{subject.tagline}</h1>
          </div>
        </div>

        <div className="ref-hero">
          <div className="ref-hero-title">Words a Grade 3 Student Should Already Know</div>
          <div className="ref-hero-sub">This is a plain reference list, not a lesson or quiz — a checklist of sight words, spelling words, and key vocabulary a Grade 2 finisher should have mastered before moving up. Tap a word once you're confident you know it.</div>
          <div className="ref-hero-stats">
            <div className="ref-hero-stat"><div className="n">{totalWords}</div><div className="l">Total Words</div></div>
            <div className="ref-hero-stat"><div className="n">{knownCount}</div><div className="l">Marked Known</div></div>
            <div className="ref-hero-stat"><div className="n">{overallPct}%</div><div className="l">Ready</div></div>
          </div>
        </div>

        <input
          className="ref-search"
          type="text"
          placeholder="Search a word or category..."
          value={query}
          onChange={e=>setQuery(e.target.value)}
        />

        {GENERAL_CATEGORIES.map(cat=>{
          const filteredWords = q
            ? cat.words.filter(w=>w.toLowerCase().includes(q))
            : cat.words;
          const catMatchesTitle = cat.title.toLowerCase().includes(q);
          if(q && filteredWords.length===0 && !catMatchesTitle) return null;
          const wordsToShow = (q && catMatchesTitle) ? cat.words : filteredWords;
          const isOpen = !!openCats[cat.id] || !!q;
          const catKnown = cat.words.filter(w=>generalKnown[cat.id+"::"+w]).length;
          const catPct = cat.words.length ? Math.round((catKnown/cat.words.length)*100) : 0;
          return (
            <div key={cat.id} className={"ref-cat" + (isOpen ? " open":"")}>
              <div className="ref-cat-head" onClick={()=>toggleCat(cat.id)}>
                <div className="ref-cat-icon">{cat.icon}</div>
                <div className="ref-cat-title">{cat.title}</div>
                <div className="ref-cat-count">{catKnown}/{cat.words.length}</div>
                <div className="ref-cat-chev">▾</div>
              </div>
              {isOpen && (
                <div className="ref-cat-body">
                  <p className="ref-cat-note">{cat.note}</p>
                  <div className="ref-word-grid">
                    {wordsToShow.map(w=>{
                      const known = !!generalKnown[cat.id+"::"+w];
                      return (
                        <button
                          key={w}
                          className={"ref-word" + (known ? " known":"")}
                          onClick={()=>toggleGeneralWord(cat.id, w)}
                        >
                          <span className="chk">{known ? "✓" : "○"}</span>
                          <span>{w}</span>
                        </button>
                      );
                    })}
                  </div>
                  <div className="ref-progress-mini">
                    <div className="ref-progress-mini-fill" style={{width:catPct+"%"}}></div>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        <div className="footer-note">SACRED HEART ACADEMY OF PASIG · GRADE SCHOOL DEPARTMENT</div>
      </React.Fragment>
    );
  }

  /* ---------------- QUARTER SCREEN ---------------- */
  function QuarterScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    const [showSetup, setShowSetup] = useState(false);
    const [generatingIds, setGeneratingIds] = useState({});
    const [genLesson, setGenLesson] = useState(null); // lesson currently being configured for AI generation
    const [genCount, setGenCount] = useState(6);
    const [genTypes, setGenTypes] = useState(new Set(GENERATE_TYPE_ORDER));
    const [genTopic, setGenTopic] = useState("");
    const [genDifficulty, setGenDifficulty] = useState("medium");
    const lessons = quarterLessons(subject, quarter, moves, customLessons);
    const nativeLessons = lessons.filter(l=>l.homeQuarterId===quarter.id);
    const movedInLessons = lessons.filter(l=>l.homeQuarterId!==quarter.id);
    const totalBankQ = lessons.reduce((sum,l)=>sum+getQuestions(l.id).length, 0);
    const [longCount, setLongCount] = useState(Math.min(10, totalBankQ) || 1);
    const [longTopics, setLongTopics] = useState([TOPIC_ALL]);
    const [longType, setLongType] = useState(TYPE_ALL);
    const longFullPool = lessons.flatMap(l=>getQuestions(l.id));
    const longAvailTopics = bankTopics(longFullPool);
    const longAvailTopicsWithCounts = longAvailTopics.map(t=>({name:t, count: longFullPool.filter(q=>normTopic(q.topic)===t).length}));
    const longTopicPool = filterByTopics(longFullPool, longTopics);
    const longFilteredCount = filterByType(longTopicPool, longType).length;
    let counter = 0;

    useEffect(()=>{ setLongCount(Math.min(10, longFilteredCount) || 1); }, [longTopics, longType, longFilteredCount]);
    useEffect(()=>{ setLongType(TYPE_ALL); }, [longTopics]);

    const [addingTopic, setAddingTopic] = useState(false);
    const [newTopicTitle, setNewTopicTitle] = useState("");
    const [newTopicSub, setNewTopicSub] = useState("");
    const [newTopicChapter, setNewTopicChapter] = useState("");

    function submitNewTopic(){
      if(!newTopicTitle.trim()) return;
      const id = addCustomTopic(subject.id, quarter.id, newTopicTitle, newTopicSub, newTopicChapter || null);
      setNewTopicTitle(""); setNewTopicSub(""); setNewTopicChapter(""); setAddingTopic(false);
      goLesson(subject.id, quarter.id, id, true);
    }

    function openGenerateSetup(l, e){
      if(e){ e.stopPropagation(); }
      if(generatingIds[l.id]) return;
      const defaultTypes = new Set(GENERATE_TYPE_ORDER);
      setGenLesson(l);
      setGenTypes(defaultTypes);
      setGenCount(getGenerateCountRange(defaultTypes).min);
      setGenTopic("");
      setGenDifficulty("medium");
    }

    function toggleGenType(t){
      setGenTypes(prev=>{
        const next = new Set(prev);
        if(next.has(t)){ if(next.size>1) next.delete(t); } else { next.add(t); }
        // Cascade: whenever the type selection changes, snap the count back
        // to the automatic (lower-end) value for the new selection.
        setGenCount(getGenerateCountRange(next).min);
        return next;
      });
    }

    async function runGenerateQuestions(){
      const l = genLesson;
      if(!l) return;
      let apiKey = loadGeminiApiKey();
      if(!apiKey){
        apiKey = window.prompt("Paste a free Gemini API key to generate quiz questions (get one at aistudio.google.com/apikey). It's saved on this device only, and also reused for story narration.");
        if(!apiKey || !apiKey.trim()) return;
        apiKey = apiKey.trim();
        saveGeminiApiKey(apiKey);
      }
      setGenLesson(null);
      setGeneratingIds(prev=>({...prev, [l.id]:true}));
      try{
        const merged = mergeLesson(l, edits);
        const generated = await generateQuestionsForLesson(apiKey, merged, {
          count: genCount,
          types: Array.from(genTypes),
          topic: genTopic,
          difficulty: genDifficulty,
          existingQuestions: getQuestions(l.id).map(q=>q.q)
        });
        if(!generated.length){
          alert("Gemini didn't return any usable questions for \"" + merged.title + "\". Try again in a moment.");
        } else {
          setLessonQuestions(l.id, [...getQuestions(l.id), ...generated]);
          alert("✨ Added " + generated.length + " new question" + (generated.length===1?"":"s") + " to \"" + merged.title + "\"'s question bank.");
        }
      }catch(err){
        alert("Couldn't generate questions: " + (err && err.message ? err.message : "unknown error"));
      }finally{
        setGeneratingIds(prev=>{ const next={...prev}; delete next[l.id]; return next; });
      }
    }

    function renderLessonCard(l0, moved){
      counter++;
      const l = mergeLesson(l0, edits);
      const rec = progress.lessons[l.id];
      const learned = rec && rec.learned;
      const best = rec && rec.best;
      const qCount = getQuestions(l.id).length;
      return (
        <button key={l.id} className="lesson-card" style={{width:"100%", border:"2px solid var(--line)", position:"relative", animationDelay:Math.min(counter*0.04,0.4)+"s"}} onClick={()=>goLesson(subject.id, quarter.id, l.id)}>
          <div className="lesson-num" style={{background:quarter.color}}>{counter}</div>
          <div className="lesson-body">
            <h3>{l.title}</h3>
            {l.sub && <div className="sub">{l.sub}</div>}
            <div className="lesson-status">
              {moved && <span className="pill todo">📦 Moved here</span>}
              {l0.isCustom && <span className="pill todo">✨ My Topic</span>}
              {getLessonVideos(l).some(u=>youtubeEmbedId(u)) && <span className="pill done">🎬 Video</span>}
              <span className={"pill " + (learned ? "done":"todo")}>{learned ? "📖 Learned" : "📖 Not started"}</span>
              <span
                role="button"
                title="Generate quiz questions with AI (Gemini) from this topic's notes"
                className="pill todo"
                style={{cursor: generatingIds[l.id] ? "default" : "pointer", opacity: generatingIds[l.id] ? 0.6 : 1}}
                onClick={(e)=>openGenerateSetup(l, e)}
              >{generatingIds[l.id] ? "⏳ Generating…" : "✨ Generate"}</span>
              {best ? (
                <span className={"pill " + (best.correct/best.total>=0.7 ? "score-good":"score-bad")}>
                  📝 {best.correct}/{best.total}
                </span>
              ) : (
                <span className="pill todo">📝 {qCount ? qCount + " Qs in bank" : "No questions yet"}</span>
              )}
            </div>
          </div>
          {l0.isCustom && (
            <span
              role="button"
              title="Delete this topic"
              className="note-remove-btn"
              style={{position:"absolute", top:8, right:8}}
              onClick={(e)=>{
                e.stopPropagation();
                if(window.confirm('Delete the topic "' + l.title + '"? This removes its notes and question bank too.')){
                  removeCustomTopic(l.id);
                }
              }}
            >✕</span>
          )}
          <div className="chev">›</div>
        </button>
      );
    }

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goSubjectHome(subject.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color}}>{subject.shortName} · {quarter.num}</div>
            <h1 style={{margin:0, fontSize:"22px"}}>{quarter.icon} {quarter.title}</h1>
          </div>
        </div>

        {quarter.chapters.map(ch=>{
          const chLessons = nativeLessons.filter(l=>l.chapterId===ch.id);
          if(!chLessons.length) return null;
          return (
            <div key={ch.id}>
              <h3 className="chapter-title">{ch.title}</h3>
              {chLessons.map(l0=>renderLessonCard(l0, false))}
            </div>
          );
        })}

        {(()=>{
          const myTopics = nativeLessons.filter(l=>l.chapterId==="custom");
          if(!myTopics.length) return null;
          return (
            <div>
              <h3 className="chapter-title">✨ My Topics</h3>
              {myTopics.map(l0=>renderLessonCard(l0, false))}
            </div>
          );
        })()}

        {movedInLessons.length > 0 && (
          <div>
            <h3 className="chapter-title">📦 Moved Topics</h3>
            {movedInLessons.map(l0=>renderLessonCard(l0, true))}
          </div>
        )}

        <div className="note-block" style={{padding:14, marginBottom:18}}>
          {addingTopic ? (
            <React.Fragment>
              <label className="field-label" style={{marginTop:0}}>Topic title</label>
              <input
                type="text" className="text-input" value={newTopicTitle}
                onChange={e=>setNewTopicTitle(e.target.value)}
                placeholder="e.g. The Water Cycle" autoFocus
              />
              <label className="field-label">Subtitle (optional)</label>
              <input
                type="text" className="text-input" value={newTopicSub}
                onChange={e=>setNewTopicSub(e.target.value)}
                placeholder="e.g. Evaporation, Condensation, Precipitation"
              />
              <label className="field-label">Add inside</label>
              <select className="text-input" value={newTopicChapter} onChange={e=>setNewTopicChapter(e.target.value)}>
                <option value="">✨ My Topics (new section)</option>
                {quarter.chapters.map(ch=>(
                  <option key={ch.id} value={ch.id}>{ch.title}</option>
                ))}
              </select>
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>{setAddingTopic(false); setNewTopicTitle(""); setNewTopicSub(""); setNewTopicChapter("");}}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} disabled={!newTopicTitle.trim()} onClick={submitNewTopic}>+ Create Topic →</button>
              </div>
            </React.Fragment>
          ) : (
            <button className="btn" style={{background:quarter.color, color:"#fff", width:"100%"}} onClick={()=>setAddingTopic(true)}>
              + Add New Topic to {quarter.title}
            </button>
          )}
        </div>

        <div className="longquiz-card" style={{flexDirection:"column", alignItems:"stretch"}}>
          <div style={{display:"flex", alignItems:"center", gap:14}}>
            <div className="lqicon">🏆</div>
            <div style={{flex:1}}>
              <h3>{quarter.title} — Long Quiz</h3>
              <p>All topics in this quarter, combined into one test. {totalBankQ} question{totalBankQ===1?"":"s"} available.{progress.longQuiz[quarter.id] ? " Best: " + progress.longQuiz[quarter.id].best.correct + "/" + progress.longQuiz[quarter.id].best.total : ""}</p>
            </div>
            {!showSetup && (
              totalBankQ > 0 ? (
                <button className="btn" style={{background:quarter.color, color:"#fff"}} onClick={()=>setShowSetup(true)}>Start</button>
              ) : (
                <span className="pill todo">No questions yet</span>
              )
            )}
          </div>
          {showSetup && (
            <div style={{marginTop:14}}>
              {longAvailTopics.length > 0 && (
                <React.Fragment>
                  <label className="field-label">Which topic(s)?</label>
                  <div style={{maxWidth:320, marginBottom:14}}>
                    <TopicPicker
                      topics={longAvailTopicsWithCounts}
                      totalCount={totalBankQ}
                      selected={longTopics}
                      onToggle={(t)=>toggleTopicSelection(longTopics, t, setLongTopics)}
                    />
                  </div>
                </React.Fragment>
              )}
              <label className="field-label">Question type?</label>
              <div style={{marginBottom:14}}>
                <QuizTypePicker pool={longTopicPool} selected={longType} onSelect={setLongType} />
              </div>
              {longFilteredCount === 0 ? (
                <p className="sub">No questions of this type for this topic yet.</p>
              ) : (
                <React.Fragment>
                  <label className="field-label">How many questions would you like to take? (1–{longFilteredCount})</label>
                  <input type="number" className="text-input" min={1} max={longFilteredCount} value={longCount}
                    onChange={e=>{
                      const raw = e.target.value;
                      if(raw === ""){ setLongCount(""); return; }
                      const v = parseInt(raw,10);
                      if(Number.isNaN(v)) return;
                      setLongCount(Math.max(1, Math.min(v, longFilteredCount)));
                    }}
                    onBlur={()=>{
                      if(longCount === "" || Number.isNaN(longCount)) setLongCount(1);
                    }} />
                </React.Fragment>
              )}
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>setShowSetup(false)}>Cancel</button>
                {longFilteredCount > 0 && (
                  <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>startLongQuiz(quarter, longCount, longTopics, longType)}>Start Long Quiz →</button>
                )}
              </div>
            </div>
          )}
        </div>
        {genLesson && (
          <div className="gen-setup-overlay" onClick={()=>setGenLesson(null)}>
            <div className="gen-setup-card" onClick={e=>e.stopPropagation()}>
              <h3 style={{margin:"0 0 4px"}}>✨ Generate Questions</h3>
              <p className="sub" style={{margin:"0 0 14px"}}>For "{mergeLesson(genLesson, edits).title}"</p>

              <label className="field-label">How many questions?</label>
              <select className="text-input" value={genCount}
                onChange={e=>setGenCount(parseInt(e.target.value,10))}>
                {(()=>{
                  const range = getGenerateCountRange(genTypes);
                  const opts = [];
                  for(let v=range.min; v<=range.max; v++) opts.push(v);
                  return opts.map(v=>(
                    <option key={v} value={v}>{v}{v===range.min ? " (recommended)" : ""}</option>
                  ));
                })()}
              </select>

              <label className="field-label">Question type(s)</label>
              <div style={{display:"flex", flexWrap:"wrap", gap:8, marginBottom:6}}>
                {GENERATE_TYPE_ORDER.map(t=>(
                  <span key={t}
                    className={"pill " + (genTypes.has(t) ? "done" : "todo")}
                    style={{cursor:"pointer"}}
                    onClick={()=>toggleGenType(t)}
                  >{genTypes.has(t) ? "✓ " : ""}{GENERATE_TYPE_LABELS[t]}</span>
                ))}
              </div>

              <label className="field-label">Topic / subtopic (optional)</label>
              <input type="text" className="text-input" placeholder={"Defaults to the whole lesson: \"" + mergeLesson(genLesson, edits).title + "\""}
                value={genTopic} onChange={e=>setGenTopic(e.target.value)} />

              <label className="field-label">Difficulty</label>
              <div style={{display:"flex", gap:8, marginBottom:6}}>
                {[["easy","🌱 Easy"],["medium","⭐ Medium"],["hard","🔥 Hard"]].map(([key,label])=>(
                  <span key={key}
                    className={"pill " + (genDifficulty===key ? "done" : "todo")}
                    style={{cursor:"pointer"}}
                    onClick={()=>setGenDifficulty(key)}
                  >{label}</span>
                ))}
              </div>

              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>setGenLesson(null)}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} onClick={runGenerateQuestions}>✨ Generate →</button>
              </div>
            </div>
          </div>
        )}
      </React.Fragment>
    );
  }

  /* ---------------- LESSON SCREEN ---------------- */
  function LessonScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    const rawLesson = allSubjectLessons(subject, customLessons).find(l=>l.id===nav.lessonId);
    const lesson = mergeLesson(rawLesson, edits);
    const tab = nav.tab || "learn";
    function setTab(t){ setNav(prev => ({...prev, tab:t})); }
    const [editingLesson, setEditingLesson] = useState(!!nav.startEdit);
    const [movingLesson, setMovingLesson] = useState(false);
    const [moveTarget, setMoveTarget] = useState("");
    const [quizCount, setQuizCount] = useState(1);
    const [quizTopics, setQuizTopics] = useState([TOPIC_ALL]);
    const [quizType, setQuizType] = useState(TYPE_ALL);
    const rec = progress.lessons[lesson.id];
    const qBank = getQuestions(lesson.id);
    const otherQuarters = subject.quarters.filter(q=>q.id !== quarter.id);
    const availTopics = bankTopics(qBank);
    const availTopicsWithCounts = availTopics.map(t=>({name:t, count: qBank.filter(q=>normTopic(q.topic)===t).length}));
    const topicFilteredBank = filterByTopics(qBank, quizTopics);
    const filteredBank = filterByType(topicFilteredBank, quizType);

    useEffect(()=>{ setQuizCount(Math.min(10, filteredBank.length) || 1); }, [lesson.id, filteredBank.length]);
    useEffect(()=>{ setQuizType(TYPE_ALL); }, [quizTopics, lesson.id]);

    const activeLessonQuiz = tab==="quiz" && quizSession && quizSession.kind==="lesson" && quizSession.key===lesson.id && !quizSession.finalAnswers;

    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goQuarter(subject.id, quarter.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color, fontSize:"9.6px"}}>{rawLesson.chapterTitle}</div>
            <h1 style={{margin:0, fontSize:"12px"}}>{lesson.title}</h1>
          </div>
        </div>

        <div className="tabbar">
          <button className={"tab" + (tab==="learn" ? " active":"")} onClick={()=>{setTab("learn"); setEditingLesson(false);}}>📖 Learn</button>
          <button className={"tab" + (tab==="quiz" ? " active":"")} onClick={()=>setTab("quiz")}>📝 Quiz{rec && rec.best ? " (" + rec.best.correct + "/" + rec.best.total + ")" : ""}</button>
          {activeLessonQuiz && (
            <button
              className="btn btn-ghost btn-sm"
              title="Stop this quiz"
              onClick={()=>{
                if(window.confirm("Stop this quiz? Your progress on this attempt won't be saved.")){
                  Sound.back();
                  setQuizSession(null);
                }
              }}
            >✕ Stop Quiz</button>
          )}
          <button className={"tab" + (tab==="manage" ? " active":"")} onClick={()=>setTab("manage")}>🗂️ Questions{qBank.length ? " (" + qBank.length + ")" : ""}</button>
        </div>

        <div key={tab} className="tab-fade">
        {tab === "learn" && (
          editingLesson ? (
            <LessonEditForm
              lesson={lesson}
              accent={quarter.color}
              onSave={(data)=>{ saveLessonEdit(lesson.id, data); setEditingLesson(false); }}
              onCancel={()=>setEditingLesson(false)}
            />
          ) : movingLesson ? (
            <div className="journal-page">
              <h3 style={{marginTop:0}}>Move "{lesson.title}" to another quarter</h3>
              <p className="sub">Currently in: {quarter.num} — {quarter.title}</p>
              <label className="field-label">Move to</label>
              <select className="text-input" value={moveTarget} onChange={e=>setMoveTarget(e.target.value)}>
                <option value="">Choose a quarter…</option>
                {otherQuarters.map(q=>(<option key={q.id} value={q.id}>{q.num} — {q.title}</option>))}
              </select>
              <div className="learn-footer" style={{gap:10}}>
                <button className="btn btn-ghost" onClick={()=>{setMovingLesson(false); setMoveTarget("");}}>Cancel</button>
                <button className="btn btn-primary" style={{background:quarter.color}} disabled={!moveTarget}
                  onClick={()=>{
                    moveLesson(lesson.id, moveTarget);
                    setMovingLesson(false);
                    goQuarter(subject.id, moveTarget);
                  }}>↔ Move Topic</button>
              </div>
            </div>
          ) : (
            <div className="journal-page learn-page">
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10, flexWrap:"wrap"}}>
                <h3 style={{marginTop:0}}>{lesson.title}{lesson.sub ? " — " + lesson.sub : ""}</h3>
                <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setEditingLesson(true)}>✏️ Edit Topic</button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setMovingLesson(true)}>↔ Move Quarter</button>
                  {rawLesson.isCustom && (
                    <button
                      className="btn btn-ghost btn-sm"
                      onClick={()=>{
                        if(window.confirm('Delete the topic "' + lesson.title + '"? This removes its notes and question bank too.')){
                          removeCustomTopic(lesson.id);
                          goQuarter(subject.id, quarter.id);
                        }
                      }}
                    >🗑 Delete Topic</button>
                  )}
                </div>
              </div>
              {rawLesson.homeQuarterId !== quarter.id && (
                <p className="sub">📦 Originally in {subject.quarters.find(q=>q.id===rawLesson.homeQuarterId).num}, moved to {quarter.num}.</p>
              )}
              {(()=>{
                // On desktop, video(s) and notes sit side by side (video sticky) instead of
                // stacking full-width one after another — keeps the Learn tab from turning
                // into one very long scroll on a wide screen, while mobile keeps the simple
                // stacked order.
                const videoIds = getLessonVideos(lesson).map(youtubeEmbedId).filter(Boolean);
                const notes = getLessonNotes(lesson);
                const multiple = notes.length > 1;
                const videoBlock = videoIds.length > 0 ? (
                  <div className="learn-video-col">
                    {videoIds.map((vid, i)=>(
                      <div className="video-embed" key={i}>
                        <iframe
                          src={"https://www.youtube.com/embed/" + vid}
                          title={lesson.title + " video " + (i+1)}
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                          allowFullScreen
                        ></iframe>
                      </div>
                    ))}
                  </div>
                ) : null;
                const notesBlock = (
                  <div className="learn-notes-col">
                    {notes.map((note, i)=>(
                      note.type === "story" ? (
                        <StoryCard key={note.id || i} note={note} index={i+1} />
                      ) : multiple ? (
                        <div className="note-card" key={note.id || i}>
                          <div className="note-card-head">📝 {note.name && note.name.trim() ? note.name.trim() : "Note " + (i+1)}</div>
                          <div className="note-view" dangerouslySetInnerHTML={{__html: note.html}}></div>
                        </div>
                      ) : (
                        <div className="note-view" key={note.id || i} dangerouslySetInnerHTML={{__html: note.html}}></div>
                      )
                    ))}
                  </div>
                );
                return videoBlock ? (
                  <div className="learn-layout">{videoBlock}{notesBlock}</div>
                ) : notesBlock;
              })()}
              <div className="learn-footer">
                <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>{markLearned(lesson.id); setTab("quiz");}}>
                  {rec && rec.learned ? "Reviewed — Take Quiz →" : "Mark as Learned & Take Quiz →"}
                </button>
              </div>
            </div>
          )
        )}

        {tab === "quiz" && (
          quizSession && quizSession.kind==="lesson" && quizSession.key===lesson.id ? (
            quizSession.finalAnswers ? (
              <ResultsView
                answers={quizSession.finalAnswers}
                accent={quarter.color}
                title={lesson.title}
                onRetry={()=>startLessonQuiz(quarter, lesson, quizCount, quizTopics, quizType)}
                onDone={()=>{setQuizSession(null);}}
              />
            ) : (
              <QuizRunner
                questions={quizSession.questions}
                accent={quarter.color}
                onFinish={handleQuizFinish}
                onStop={()=>{setQuizSession(null);}}
                showStopInline={false}
              />
            )
          ) : (
            <div className="quiz-card" style={{textAlign:"center"}}>
              {qBank.length === 0 ? (
                <React.Fragment>
                  <p style={{marginTop:0}}>No questions yet for <strong>{lesson.title}</strong>.</p>
                  <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>setTab("manage")}>➕ Add Questions</button>
                </React.Fragment>
              ) : (
                <React.Fragment>
                  <p style={{marginTop:0}}>Ready to test what you learned about <strong>{lesson.title}</strong>?</p>
                  {availTopics.length > 0 && (
                    <React.Fragment>
                      <label className="field-label">Which topic(s)?</label>
                      <div style={{maxWidth:320, margin:"0 auto 14px"}}>
                        <TopicPicker
                          topics={availTopicsWithCounts}
                          totalCount={qBank.length}
                          selected={quizTopics}
                          onToggle={(t)=>toggleTopicSelection(quizTopics, t, setQuizTopics)}
                        />
                      </div>
                    </React.Fragment>
                  )}
                  <label className="field-label">Question type?</label>
                  <div style={{maxWidth:320, margin:"0 auto 14px"}}>
                    <QuizTypePicker pool={topicFilteredBank} selected={quizType} onSelect={setQuizType} />
                  </div>
                  {filteredBank.length === 0 ? (
                    <p className="sub">No questions of this type for this topic yet.</p>
                  ) : (
                    <React.Fragment>
                      <label className="field-label">How many questions would you like to take? (1–{filteredBank.length})</label>
                      <input type="number" className="text-input" style={{maxWidth:120, margin:"0 auto 14px"}} min={1} max={filteredBank.length} value={quizCount}
                        onChange={e=>{
                          const raw = e.target.value;
                          if(raw === ""){ setQuizCount(""); return; }
                          const v = parseInt(raw,10);
                          if(Number.isNaN(v)) return;
                          setQuizCount(Math.max(1, Math.min(v, filteredBank.length)));
                        }}
                        onBlur={()=>{
                          if(quizCount === "" || Number.isNaN(quizCount)) setQuizCount(1);
                        }} />
                      <div>
                        <button className="btn btn-primary" style={{background:quarter.color}} onClick={()=>startLessonQuiz(quarter, lesson, quizCount, quizTopics, quizType)}>
                          {rec && rec.best ? "Retake Quiz" : "Start Quiz"}
                        </button>
                      </div>
                    </React.Fragment>
                  )}
                </React.Fragment>
              )}
            </div>
          )
        )}

        {tab === "manage" && (
          <QuestionBankManager
            lessonId={lesson.id}
            questions={qBank}
            accent={quarter.color}
            onChange={(next)=>setLessonQuestions(lesson.id, next)}
          />
        )}
        </div>
      </React.Fragment>
    );
  }

  /* ---------------- LONG QUIZ SCREEN (uses quizSession set at quarter level) ---------------- */
  function LongQuizScreen(){
    const subject = currentSubject();
    const quarter = subject.quarters.find(q=>q.id===nav.quarterId);
    return (
      <React.Fragment>
        <div className="backbar">
          <button className="backbtn" onClick={()=>goQuarter(subject.id, quarter.id)}>←</button>
          <div>
            <div className="qnum" style={{color:quarter.color}}>{subject.shortName} · {quarter.num} · Long Quiz</div>
            <h1 style={{margin:0, fontSize:"20px"}}>🏆 {quarter.title}</h1>
          </div>
        </div>
        {quizSession.finalAnswers ? (
          <ResultsView
            answers={quizSession.finalAnswers}
            accent={quarter.color}
            title={quarter.title + " Long Quiz"}
            onRetry={()=>startLongQuiz(quarter)}
            onDone={()=>{setQuizSession(null); goQuarter(subject.id, quarter.id);}}
          />
        ) : (
          <QuizRunner
            questions={quizSession.questions}
            accent={quarter.color}
            onFinish={handleQuizFinish}
            onStop={()=>{setQuizSession(null); goQuarter(subject.id, quarter.id);}}
          />
        )}
      </React.Fragment>
    );
  }

  let content;
  if(quizSession && quizSession.kind==="long"){
    content = <LongQuizScreen/>;
  } else if(nav.screen==="quarter"){
    content = <QuarterScreen/>;
  } else if(nav.screen==="lesson"){
    content = <LessonScreen/>;
  } else if(nav.screen==="home"){
    content = <SubjectHomeScreen/>;
  } else if(nav.screen==="general"){
    content = <GeneralScreen/>;
  } else if(nav.screen==="notes"){
    content = <NotesScreen/>;
  } else if(nav.screen==="typing"){
    content = <TypingGalaxyScreen/>;
  } else if(nav.screen==="grades"){
    content = <GradesScreen/>;
  } else if(nav.screen==="subjects"){
    content = <SubjectsScreen/>;
  } else {
    content = <DashboardScreen/>;
  }

  const headerIcon = nav.subjectId ? (currentSubject() ? currentSubject().icon : "🎓") : "🎓";
  const headerLabel = nav.subjectId && currentSubject() ? currentSubject().name : "Grade 2";
  const headerBg = nav.subjectId && currentSubject() ? currentSubject().color : "linear-gradient(150deg, var(--night), var(--night-deep))";
  const screenKey = (quizSession && quizSession.kind==="long" ? "longquiz-"+quizSession.key : nav.screen) + "-" + (nav.subjectId||"") + "-" + (nav.quarterId||"") + "-" + (nav.lessonId||"");

  const headerBar = (
    <div className={"app-header" + (nav.subjectId ? " app-header-footer" : "")}>
      <div className="brand" onClick={goDashboard} style={{cursor:"pointer"}}>
        <div className="brand-badge" style={{background:headerBg}}><SubjectIcon icon={headerIcon}/></div>
        <div className="brand-text">
          <div className="eyebrow">Sacred Heart Academy of Pasig</div>
          <h1>{headerLabel}</h1>
        </div>
      </div>
      <div className="header-actions">
        {settings.darkMode && nav.screen!=="typing" && (
          <button
            className="settings-btn"
            title="Turn off dark mode"
            onClick={()=>updateSettings({darkMode: false})}
          >☀️</button>
        )}
        <button
          className="settings-btn"
          title={settings.soundEnabled !== false ? "Mute sound" : "Unmute sound"}
          onClick={()=>{
            const next = settings.soundEnabled === false;
            updateSettings({soundEnabled: next});
            if(next) setTimeout(()=>Sound.tap(), 30);
          }}
        >{settings.soundEnabled !== false ? "🔊" : "🔇"}</button>
        <button className="settings-btn" title="Grades" onClick={goGrades}>🎓</button>
        <button className="settings-btn" title="Save everything now" onClick={saveEverythingNow}>💾</button>
        <button className="settings-btn" title="Export all data as JSON (progress, topics, quiz bank & offline audio cache)" onClick={exportAllData}>⬇️</button>
        <button className="settings-btn" title="Import data from JSON backup (progress, topics, quiz bank & offline audio cache)" onClick={()=>importInputRef.current && importInputRef.current.click()}>⬆️</button>
        <input
          ref={importInputRef}
          type="file"
          accept="application/json,.json"
          style={{display:"none"}}
          onChange={(e)=>{
            const file = e.target.files && e.target.files[0];
            if(file) importAllData(file);
            e.target.value = "";
          }}
        />
      </div>
    </div>
  );

  return (
    <React.Fragment>
      {settings.darkMode && <Starfield/>}
      {!nav.subjectId && headerBar}
      {saveFlash && <div className="save-toast">{saveFlash}</div>}
      <div key={screenKey} className="screen-enter">{content}</div>
      {nav.subjectId && headerBar}
    </React.Fragment>
  );
}

/* =========================================================
   STARTUP — mount instantly from whatever's in localStorage,
   then hydrate from Firebase in the background so other-device
   progress still shows up, without blocking first paint.
   ========================================================= */
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
loadFromCloud().then(cloudSynced => {
  if(cloudSynced) window.dispatchEvent(new Event("gs4-cloud-synced"));
});
</script>
</body>
</html>
