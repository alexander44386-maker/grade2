const MALE_NAME_HINTS = new Set(["juan", "jose", "miguel", "gabriel", "daniel", "matthew", "matteo", "marco", "mark", "paolo", "paulo", "carlo", "carlos", "antonio", "anton", "emmanuel", "manuel", "rafael", "ramon", "ricardo", "eduardo", "fernando", "francisco", "francis", "angelo", "dominic", "vincent", "vincente", "benedict", "benjamin", "ben", "noah", "liam", "ethan", "lucas", "luke", "james", "john", "jacob", "josh", "joshua", "aaron", "adrian", "andrei", "andres", "bryan", "brian", "christian", "christopher", "dennis", "edward", "eric", "ferdinand", "gerald", "henry", "ian", "isaac", "ivan", "jaime", "jayson", "jason", "jerome", "jerald", "jhon", "joel", "jonathan", "joseph", "julius", "justin", "kevin", "kian", "kurt", "leo", "leon", "louie", "louis", "mario", "martin", "michael", "nathan", "nathaniel", "nico", "nicolas", "noel", "oliver", "oscar", "patrick", "paul", "peter", "philip", "raphael", "raymond", "rey", "reyman", "robert", "rodel", "romeo", "ronald", "russel", "russell", "ryan", "samuel", "sean", "seth", "simon", "steven", "timothy", "tristan", "victor", "vince", "warren", "wesley", "william", "xander", "zach", "zachary"]);
const FEMALE_NAME_HINTS = new Set(["maria", "mary", "angel", "angela", "angelica", "ana", "anna", "andrea", "bianca", "camille", "carmela", "carmen", "catherine", "kathryn", "kate", "charlene", "cherry", "chloe", "christine", "claire", "clarisse", "daniela", "diana", "dianne", "elaine", "elena", "elizabeth", "erica", "erika", "eva", "faith", "frances", "francesca", "gabriela", "gabriella", "grace", "hannah", "hazel", "irish", "isabel", "isabella", "jade", "janella", "janine", "jasmine", "jean", "jennifer", "jenny", "jessica", "jill", "joan", "joyce", "judy", "julia", "juliana", "karen", "katrina", "kimberly", "kris", "kristine", "kyla", "laarni", "lea", "leah", "lian", "liana", "liza", "louella", "lourdes", "lucia", "luna", "mae", "maeve", "maica", "maricel", "marielle", "marife", "marilou", "marjorie", "meg", "megan", "michelle", "mika", "mikaela", "mira", "monica", "nadine", "nica", "nicole", "nikki", "nina", "olivia", "patricia", "pauline", "precious", "princess", "queenie", "rachel", "raine", "regina", "reign", "rhea", "rica", "riza", "rona", "rosa", "rose", "rowena", "sam", "samantha", "sarah", "shaira", "sharlene", "shayne", "sheena", "sofia", "sophia", "stella", "susan", "tricia", "trisha", "valerie", "vanessa", "veronica", "victoria", "yna", "yzabel", "zoe"]);

// Guesses which voice pool ("m" / "f" / null-for-neutral) a character
// name leans toward. Checks the curated lists first, then falls back to
// a couple of very soft common name-ending patterns, and finally gives
// up cleanly (returns null) rather than guessing wildly — an
// unrecognized/ambiguous name just draws from the full neutral pool.
function guessNameGenderPool(rawName) {
  if (!rawName) return null;
  const first = String(rawName).trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, "");
  if (!first) return null;
  if (MALE_NAME_HINTS.has(first)) return "m";
  if (FEMALE_NAME_HINTS.has(first)) return "f";
  // Soft fallback pattern (Filipino/Spanish/English names ending in
  // "a" skew female, e.g. Maria/Rosa/Liza; ending in "o" skew male,
  // e.g. Marco/Paulo/Romeo) — deliberately conservative, so anything
  // that doesn't fit either pattern just returns null (neutral).
  if (/a$/.test(first)) return "f";
  if (/o$/.test(first)) return "m";
  return null;
}

// Picks a voice for `name` out of `pool` using a hash of the NAME
// itself (not the character's array position), so:
//   1) the same name always lands on the same voice, read after read
//   2) short stories with only 1-2 characters stop always landing on
//      voice[0]/voice[1] — the old bug, since index was just "which
//      speaker happened to appear first" — and instead spread out
//      across the whole gender-matched pool.
// If the hashed voice is already taken by another character in this
// same story, linearly probes forward to the next free slot in the
// pool so two different characters don't end up sounding identical.
function pickVoiceForName(name, pool, usedVoices) {
  const h = hashStoryText(String(name).toLowerCase());
  const hNum = parseInt(h.split("_")[0], 36) || 0;
  const idx = hNum % pool.length;
  for (let tries = 0; tries < pool.length; tries++) {
    const candidate = pool[(idx + tries) % pool.length];
    if (!usedVoices.has(candidate)) {
      usedVoices.add(candidate);
      return candidate;
    }
  }
  return pool[idx]; // every voice in this pool already used (big cast) — reuse is unavoidable
}

// Normalizes whatever a person typed in the story JSON's "genders" map
// ("boy", "girl", "male", "female", "m", "f", mixed case, etc.) down to
// "m" / "f" / null. Anything unrecognized returns null so it falls
// through to the name-guess heuristic instead of erroring out.
function normalizeGenderValue(raw) {
  if (!raw) return null;
  const v = String(raw).trim().toLowerCase();
  if (v === "boy" || v === "male" || v === "m" || v === "man") return "m";
  if (v === "girl" || v === "female" || v === "f" || v === "woman") return "f";
  return null;
}

// `genderOverrides` is an optional {characterName: "boy"|"girl"|...} map,
// straight from the story JSON's "genders" field — see STORY_JSON_SAMPLE.
// An explicit override always wins over the name-guess heuristic, so a
// name the guesser would get wrong (nicknames, invented character names,
// names outside the curated lists, etc.) can just be stated directly.
function assignGeminiVoices(segments, genderOverrides) {
  const names = Array.from(new Set(segments.map(s => s.speaker || "Narrator")));
  const map = {};
  const usedVoices = new Set();
  // Case-insensitive lookup, since a hand-typed or LLM-written "genders"
  // map won't always match a speaker's capitalization exactly (e.g.
  // "maya" in genders vs "Maya" as the speaker name).
  const overridesLower = {};
  if (genderOverrides) {
    Object.keys(genderOverrides).forEach(k => {
      overridesLower[k.trim().toLowerCase()] = genderOverrides[k];
    });
  }
  names.forEach((name, i) => {
    if (name === "Narrator") {
      // The narrator's voice can be steered the same way a character's
      // can — via a "Narrator" entry in the genders map — so a specific
      // male/female voice pool is used instead of the full neutral pool.
      // No override -> unchanged old behavior (draws from every voice).
      const narratorGender = normalizeGenderValue(overridesLower["narrator"]);
      const narratorPool = narratorGender === "f" ? GEMINI_VOICES_FEMALE_LEANING : narratorGender === "m" ? GEMINI_VOICES_MALE_LEANING : GEMINI_TTS_VOICES;
      map[name] = {
        voice: pickVoiceForName(name, narratorPool, usedVoices),
        style: "calm and gentle storyteller"
      };
      return;
    }
    const overrideGender = normalizeGenderValue(overridesLower[name.trim().toLowerCase()]);
    const genderPool = overrideGender || guessNameGenderPool(name);
    const pool = genderPool === "f" ? GEMINI_VOICES_FEMALE_LEANING : genderPool === "m" ? GEMINI_VOICES_MALE_LEANING : GEMINI_TTS_VOICES; // unrecognized/ambiguous name -> safe neutral fallback (full pool)
    map[name] = {
      voice: pickVoiceForName(name, pool, usedVoices),
      style: GEMINI_VOICE_STYLES[i % GEMINI_VOICE_STYLES.length]
    };
  });
  return map;
}

// Splits a story's segments into parts of at most 2 distinct speakers
// and at most 6 lines each. A new part starts as soon as either limit
// would be exceeded by the next line.
function chunkStoryForGemini(segments) {
  const parts = [];
  let current = null;
  segments.forEach(seg => {
    const label = seg.speaker || "Narrator";
    if (current) {
      const speakerCountAfter = current.speakerSet.size + (current.speakerSet.has(label) ? 0 : 1);
      if (current.lines.length >= 6 || speakerCountAfter > 2) {
        parts.push(current);
        current = null;
      }
    }
    if (!current) current = {
      speakerSet: new Set(),
      lines: []
    };
    current.speakerSet.add(label);
    current.lines.push({
      label,
      text: seg.text
    });
  });
  if (current && current.lines.length) parts.push(current);
  return parts;
}

// Raw PCM (16-bit, mono, 24kHz — Gemini TTS's output format) needs a
// 44-byte WAV header wrapped around it before <audio>/Audio() will
// play it directly from a Blob URL.
// Accepts an array of base64 PCM chunks (one per story "part", in
// order) and wraps them behind a SINGLE WAV header, so many API
// responses become one seamless full-story audio file — this is the
// file that gets cached and replayed later.
function base64PcmChunksToWavBlob(base64Chunks, sampleRate, channels) {
  sampleRate = sampleRate || 24000;
  channels = channels || 1;
  const byteArrays = base64Chunks.map(b64 => {
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  });
  const len = byteArrays.reduce((sum, a) => sum + a.length, 0);
  const blockAlign = channels * 2;
  const byteRate = sampleRate * blockAlign;
  const buffer = new ArrayBuffer(44 + len);
  const view = new DataView(buffer);
  function writeStr(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + len, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, len, true);
  const out = new Uint8Array(buffer, 44);
  let offset = 0;
  byteArrays.forEach(a => {
    out.set(a, offset);
    offset += a.length;
  });
  return new Blob([buffer], {
    type: "audio/wav"
  });
}
function pcm16ToWavBlob(base64Pcm, sampleRate, channels) {
  return base64PcmChunksToWavBlob([base64Pcm], sampleRate, channels);
}

// One network call per "part" (see chunkStoryForGemini). Throws on
// failure so the caller can skip just this part instead of losing the
// whole story.
async function callGeminiTTS(apiKey, part, voiceMap) {
  const speakers = Array.from(part.speakerSet);
  const isMulti = speakers.length > 1;
  // IMPORTANT: single-speaker parts used to get a differently-worded
  // prompt with the speaker label stripped out entirely (just the raw
  // line text). Since each "part" is its own separate, stateless Gemini
  // TTS call, that meant the SAME character could be fed two genuinely
  // different prompt shapes depending on which other lines happened to
  // land in the same chunk — and Gemini would render the same voiceName
  // with a noticeably different performance as a result. Always using
  // the exact same "Label: text" line format, and always repeating that
  // character's fixed style phrase (from assignGeminiVoices), gives the
  // model identical steering input for that character every single time,
  // regardless of chunk boundaries.
  const linesText = part.lines.map(l => `${l.label}: ${l.text}`).join("\n");
  const styleNotes = speakers.map(s => `${s} speaks in a ${voiceMap[s] && voiceMap[s].style || "warm and gentle"} voice.`).join(" ");
  const promptText = `TTS the following story for young children, in a warm, natural, gentle storytelling voice. ${styleNotes}\n${linesText}`;
  // Multi-speaker mode needs each speaker's name in speechConfig to
  // exactly match the name used in the prompt text above.
  const speechConfig = isMulti ? {
    multiSpeakerVoiceConfig: {
      speakerVoiceConfigs: speakers.map(s => ({
        speaker: s,
        voiceConfig: {
          prebuiltVoiceConfig: {
            voiceName: voiceMap[s] && voiceMap[s].voice || voiceMap[s]
          }
        }
      }))
    }
  } : {
    voiceConfig: {
      prebuiltVoiceConfig: {
        voiceName: voiceMap[speakers[0]] && voiceMap[speakers[0]].voice || voiceMap[speakers[0]]
      }
    }
  };
  const res = await fetch(`${GEMINI_TTS_URL}?key=${encodeURIComponent(apiKey)}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      contents: [{
        parts: [{
          text: promptText
        }]
      }],
      generationConfig: {
        responseModalities: ["AUDIO"],
        speechConfig
      }
    })
  });
  if (!res.ok) {
    let detail = "";
    try {
      detail = (await res.text()).slice(0, 200);
    } catch (e) {}
    const err = new Error(`Gemini TTS request failed (${res.status})${detail ? ": " + detail : ""}`);
    err.status = res.status;
    throw err;
  }
  const data = await res.json();
  const inlineData = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].inlineData;
  const b64 = inlineData && inlineData.data;
  if (!b64) throw new Error("Gemini TTS returned no audio");
  return b64;
}

// Plays a story using Gemini TTS, one <Audio> per part, parts in
// sequence. Falls back to the free browser voice (playStory) if no key
// is set — that's the ONLY point where it can fall back; once Gemini
// playback has started, a part that fails is skipped (via onPartError),
// never swapped mid-story to the browser voice, so a story is always
// either fully Gemini or fully browser, never a mix of the two.
// onProgress({part, total, phase}) fires per part — phase is "loading"
// while the API call is in flight, then "playing" once audio starts —
// so the UI can show "generating part 2 of 5" / "playing part 2 of 5".
// onPartError(err, partIdx) fires when a part fails after its one
// immediate retry and playback skips ahead. onPartRecovered(partIdx)
// fires later if a background retry (after the story ends) succeeds in
// filling that gap — useful for clearing an earlier warning in the UI.
// noteId lets the cache tell two different story cards apart even if
// their text briefly matches; text is still the real cache key driver
// (edit a story and it's treated as new).
function playStoryWithGemini(text, {
  onSegment,
  onEnd,
  onPartError,
  onPartRecovered,
  onDownloadComplete,
  onProgress,
  onFallback,
  noteId,
  forceRegenerate,
  genders
} = {}) {
  const apiKey = loadGeminiApiKey();
  const segments = parseStorySegments(text);
  if (!apiKey || !segments.length) {
    if (onFallback) onFallback();
    return playStory(text, {
      onSegment,
      onEnd
    });
  }
  const cacheKey = storyAudioCacheKey(noteId, text, genders);
  let stopped = false;
  let audioEl = null;
  let timeupdateHandler = null;
  function playWholeBlob(blob, fromCache) {
    if (stopped) return;
    const url = URL.createObjectURL(blob);
    audioEl = new Audio(url);
    // Fixed 91% speed — only applies to already-downloaded/cached audio
    // (this is the sole call site for playWholeBlob). Live part-by-part
    // generation below is untouched, so speed here never affects a story
    // that's still being generated. playbackRate is applied at playback
    // time only, so it doesn't touch what's stored in IndexedDB.
    audioEl.playbackRate = 0.91;
    audioEl.addEventListener("loadedmetadata", () => {
      const realStarts = estimateSegmentStarts(segments, audioEl.duration || 0);
      timeupdateHandler = () => {
        let idx = 0;
        for (let i = 0; i < realStarts.length; i++) {
          if (audioEl.currentTime >= realStarts[i]) idx = i;
        }
        if (onSegment) onSegment(idx);
      };
      audioEl.addEventListener("timeupdate", timeupdateHandler);
    });
    if (onProgress) onProgress({
      part: 1,
      total: 1,
      phase: fromCache ? "cached" : "playing"
    });
    audioEl.onended = () => {
      URL.revokeObjectURL(url);
      if (onEnd) onEnd();
    };
    audioEl.onerror = () => {
      URL.revokeObjectURL(url);
      if (onEnd) onEnd();
    };
    audioEl.play().catch(() => {
      if (onEnd) onEnd();
    });
  }
  (async () => {
    if (!forceRegenerate) {
      const cached = await getCachedStoryAudio(cacheKey);
      if (cached && !stopped) {
        playWholeBlob(cached, true);
        return;
      }
    }
    // No cached full-story audio yet (or a fresh version was requested) —
    // generate every part now, playing progressively. Each part's raw
    // audio is saved to IndexedDB the moment it downloads (under its own
    // sub-key), independent of the other parts, so partial progress is
    // never lost. A part that fails gets one immediate retry; if that
    // also fails, playback skips ahead (never blocks the story) but the
    // part is queued and retried again in the background after the
    // story finishes, filling the gap and re-saving as it goes, until
    // every part is present and the full stitched file can be cached.
    const parts = chunkStoryForGemini(segments);
    const voiceMap = assignGeminiVoices(segments, genders);
    const collected = new Array(parts.length).fill(null);
    let failedParts = [];
    let globalIdx = 0;
    async function fetchPartWithRetry(part) {
      // Up to 3 attempts total (1 initial + 2 retries) with growing
      // pauses in between. This matters most for part 0: the very
      // first Gemini call in a session is the most likely to hit a
      // transient cold-start error (timeout / 503 / momentary hiccup)
      // before the API "warms up" — later parts rarely see this, since
      // by then a call has already succeeded once. A single quick
      // retry wasn't enough to reliably survive that window, so part 1
      // kept getting marked failed and skipped while parts 2+ played
      // fine. More attempts with longer backoff fixes that without
      // slowing down the common case (first try usually just works).
      const delays = [800, 3000];
      let lastErr;
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          return await callGeminiTTS(apiKey, part, voiceMap);
        } catch (e) {
          lastErr = e;
          if (stopped) throw e;
          if (attempt === delays.length) break; // out of retries
          // Rate limits (429) need a much longer pause than a plain
          // network hiccup/cold-start, or the retry just gets rate
          // limited again.
          await new Promise(r => setTimeout(r, e.status === 429 ? 6000 : delays[attempt]));
        }
      }
      throw lastErr;
    }
    async function finalizeAndCacheFullStory() {
      if (onProgress) onProgress({
        part: parts.length,
        total: parts.length,
        phase: "saving"
      });
      try {
        const fullBlob = base64PcmChunksToWavBlob(collected);
        await setCachedStoryAudio(cacheKey, fullBlob);
        // Full story is saved now — the per-part entries are redundant.
        for (let i = 0; i < parts.length; i++) {
          deleteCachedStoryAudio(storyPartCacheKey(cacheKey, i)).catch(() => {});
        }
      } catch (e) {
        console.warn("Could not save story audio to device storage:", e);
      }
    }
    async function retryFailedPartsInBackground() {
      // Keeps making passes over whatever's still failing — spaced
      // further apart each round — instead of trying once and giving
      // up. This is what lets a part recover later once a rate limit
      // window clears, rather than staying skipped forever.
      const maxRounds = 8;
      const roundDelays = [5000, 10000, 20000, 30000, 40000, 50000, 60000, 85000]; // sums to ~5 min
      for (let round = 0; round < maxRounds && failedParts.length; round++) {
        for (const idx of failedParts.slice()) {
          if (stopped) return;
          await new Promise(r => setTimeout(r, roundDelays[round]));
          try {
            const part = parts[idx];
            const b64 = await callGeminiTTS(apiKey, part, voiceMap);
            collected[idx] = b64;
            try {
              await setCachedStoryAudio(storyPartCacheKey(cacheKey, idx), b64);
            } catch (e) {}
            failedParts = failedParts.filter(i => i !== idx);
            if (onPartRecovered) onPartRecovered(idx);
          } catch (e) {
            console.warn(`Background retry (round ${round + 1}/${maxRounds}) still failing for part`, idx, e.message);
          }
        }
      }
      if (stopped) return;
      if (failedParts.length === 0 && collected.every(c => c)) {
        await finalizeAndCacheFullStory();
        if (onDownloadComplete) onDownloadComplete({
          success: true
        });
      } else if (onDownloadComplete) {
        // Ran out of rounds and some part(s) never came through — tell
        // the UI so it can stop saying "retrying" and show something
        // the person can act on (e.g. try again later, or replay to
        // re-trigger background retry from scratch).
        onDownloadComplete({
          success: false,
          missingParts: failedParts.length
        });
      }
    }
    async function playPart(partIdx) {
      if (stopped) return;
      if (partIdx >= parts.length) {
        if (failedParts.length === 0 && collected.every(c => c)) {
          await finalizeAndCacheFullStory();
        } else if (failedParts.length) {
          retryFailedPartsInBackground(); // runs after onEnd, doesn't block playback
        }
        if (onEnd) onEnd();
        return;
      }
      const part = parts[partIdx];
      if (onSegment) onSegment(globalIdx);
      if (onProgress) onProgress({
        part: partIdx + 1,
        total: parts.length,
        phase: "loading"
      });
      function advance() {
        globalIdx += part.lines.length;
        playPart(partIdx + 1);
      }
      try {
        // Reuse a part saved by an earlier attempt (this session or a
        // prior background retry) instead of re-downloading it.
        let b64 = await getCachedStoryAudio(storyPartCacheKey(cacheKey, partIdx));
        if (!b64) {
          b64 = await fetchPartWithRetry(part);
          if (stopped) return;
          try {
            await setCachedStoryAudio(storyPartCacheKey(cacheKey, partIdx), b64);
          } catch (e) {}
        }
        collected[partIdx] = b64;
        const blob = pcm16ToWavBlob(b64);
        const url = URL.createObjectURL(blob);
        audioEl = new Audio(url);
        if (onProgress) onProgress({
          part: partIdx + 1,
          total: parts.length,
          phase: "playing"
        });
        audioEl.onended = () => {
          URL.revokeObjectURL(url);
          advance();
        };
        audioEl.onerror = () => {
          URL.revokeObjectURL(url);
          advance();
        };
        audioEl.play().catch(advance);
      } catch (e) {
        console.warn("Gemini TTS part failed, skipping:", e.message);
        failedParts.push(partIdx);
        if (onPartError) onPartError(e, partIdx);
        advance();
      }
    }
    playPart(0);
  })();
  return {
    stop() {
      stopped = true;
      if (audioEl) {
        if (timeupdateHandler) audioEl.removeEventListener("timeupdate", timeupdateHandler);
        audioEl.pause();
        audioEl = null;
      }
    },
    // Pause/resume are meant for the already-downloaded/cached playback
    // path (playWholeBlob) — pausing there just pauses the one <audio>
    // element already holding the full story. Calling these while a part
    // is still being generated (audioEl not yet created for that part,
    // or between parts) is a harmless no-op rather than an error, but the
    // UI only shows the Pause button when phase === "cached" so this
    // realistically only fires against the cached-audio element.
    pause() {
      if (audioEl) audioEl.pause();
    },
    resume() {
      if (audioEl) audioEl.play().catch(() => {});
    }
  };
}

// Small hook so any StoryCard reflects the current Gemini key without a
// full remount — see saveGeminiApiKey()'s broadcast above.
function useGeminiApiKey() {
  const [key, setKey] = useState(() => loadGeminiApiKey());
  useEffect(() => {
    function refresh() {
      setKey(loadGeminiApiKey());
    }
    window.addEventListener("gemini-key-changed", refresh);
    return () => window.removeEventListener("gemini-key-changed", refresh);
  }, []);
  return key;
}

// Converts the {name, lines:[{speaker,text}]} / bare-array JSON format (the
// format handed to ChatGPT/Claude so it can write a story as JSON) into the
// plain "Name: text" convention the story textarea and playStory() use.
